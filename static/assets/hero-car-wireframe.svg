<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none" aria-hidden="true">
  <!-- Transparent wireframe sedan  no background box -->
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6BB6FF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1E8BFF" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g stroke="url(#glow)" stroke-width="1.6" filter="url(#soft)" stroke-linecap="round" stroke-linejoin="round">
    <!-- body silhouette -->
    <path d="M70 230 C95 165 140 120 210 105 C280 90 350 92 410 115 C460 135 505 170 530 210 L560 230 C575 238 575 255 555 255 L85 255 C65 255 58 238 70 230Z"/>
    <!-- roof / cabin -->
    <path d="M175 145 L310 132 L380 175 L200 185 Z" opacity="0.85"/>
    <path d="M320 135 L400 128 L455 175 L385 180 Z" opacity="0.7"/>
    <!-- windows -->
    <path d="M190 150 L300 140 L305 170 L205 178 Z" opacity="0.55"/>
    <path d="M330 140 L395 135 L430 170 L340 175 Z" opacity="0.5"/>
    <!-- wheels -->
    <circle cx="160" cy="255" r="36"/>
    <circle cx="160" cy="255" r="18" opacity="0.7"/>
    <circle cx="455" cy="255" r="36"/>
    <circle cx="455" cy="255" r="18" opacity="0.7"/>
    <!-- underglow line -->
    <path d="M95 255 L530 255" opacity="0.35"/>
    <!-- engine / battery block -->
    <rect x="250" y="195" width="70" height="40" rx="4" opacity="0.8"/>
    <path d="M260 205 H310 M260 215 H300 M260 225 H305" opacity="0.65"/>
    <!-- connection nodes -->
    <circle cx="285" cy="175" r="3.5" fill="#1E8BFF" stroke="none"/>
    <circle cx="360" cy="150" r="3" fill="#6BB6FF" stroke="none"/>
    <circle cx="200" cy="190" r="2.5" fill="#6BB6FF" stroke="none"/>
    <circle cx="480" cy="190" r="3" fill="#1E8BFF" stroke="none"/>
    <path d="M285 175 L360 150 M285 175 L200 190 M285 175 L480 190" opacity="0.45" stroke-width="1"/>
    <!-- side detail -->
    <path d="M120 210 C180 200 240 198 300 205" opacity="0.5"/>
    <path d="M340 208 C400 200 450 205 500 220" opacity="0.45"/>
  </g>
</svg>
